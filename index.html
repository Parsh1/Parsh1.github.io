<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- ===================================================================== -->
  <!-- START MODULE 0: PAGE TITLE                                            -->
  <!-- ===================================================================== -->
  <title>YOUR FULL NAME // PORTFOLIO</title>
  <!-- ===================================================================== -->
  <!-- END MODULE 0                                                          -->
  <!-- ===================================================================== -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <!-- ===================================================================== -->
  <!-- START MODULE CSS: FLAT PLUM MONOSPACE STYLES                          -->
  <!-- ===================================================================== -->
  <style>
    :root {
      --plum: rgb(116, 13, 130);          /* #740D82 */
      --plum-dark: rgb(76, 8, 86);
      --plum-tint: rgba(116, 13, 130, 0.08);
      --plum-wash: rgba(116, 13, 130, 0.16);
      --paper: #F7F5F8;
      --surface: #FFFFFF;
      --ink: #17131A;
      --ink-muted: #554D5C;
      --border: #D8CFE0;
      --mono: "JetBrains Mono", "Space Mono", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--mono);
      background-color: var(--paper);
      color: var(--ink);
      line-height: 1.65;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Subtle watercolor plum wash in corner */
    .watercolor-stain {
      position: fixed;
      top: -140px;
      left: -140px;
      width: 560px;
      height: 560px;
      background: radial-gradient(circle, rgba(116, 13, 130, 0.14) 0%, rgba(116, 13, 130, 0.04) 55%, transparent 72%);
      filter: blur(45px);
      pointer-events: none;
      z-index: 0;
    }

    /* ================= STAGE 1: SPRING LAUNCH COVER ================= */
    .spring-stage {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      transition: opacity 0.4s ease;
    }

    .spring-stage.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .spring-stage.hidden {
      display: none;
    }

    .launcher-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    /* Your Name perched on top of the spring */
    .spring-name-plate {
      background: var(--plum);
      color: #FFFFFF;
      padding: 1.35rem 2.75rem;
      border: 2px solid var(--ink);
      font-size: clamp(1.8rem, 4.5vw, 3.2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease;
      transform-origin: bottom center;
    }

    .launcher-unit:hover .spring-name-plate {
      background: var(--plum-dark);
      transform: translateY(6px);
    }

    /* Compress state when clicked */
    .launcher-unit.compressing .spring-name-plate {
      transform: translateY(46px) scaleY(0.95);
      transition: transform 0.18s ease-in;
    }

    /* Launch state upward */
    .launcher-unit.launching .spring-name-plate {
      transform: translateY(-65vh);
      transition: transform 0.48s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Geometric SVG Spring */
    .spring-svg {
      width: 140px;
      height: 110px;
      display: block;
      overflow: visible;
      transform-origin: bottom center;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .launcher-unit:hover .spring-svg {
      transform: scaleY(0.92);
    }

    .launcher-unit.compressing .spring-svg {
      transform: scaleY(0.45);
      transition: transform 0.18s ease-in;
    }

    .launcher-unit.launching .spring-svg {
      transform: scaleY(1.35);
      transition: transform 0.25s ease-out;
    }

    .spring-base-line {
      width: 220px;
      height: 3px;
      background: var(--ink);
    }

    .click-cue {
      margin-top: 1.1rem;
      font-size: 0.78rem;
      color: var(--plum);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ================= STAGE 2: FLAT LOW-MARGIN WORKSPACE ================= */
    .workspace {
      display: none;
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 0.45s ease, transform 0.45s ease;
      position: relative;
      z-index: 1;
      width: 96%;
      max-width: 1440px;
      margin: 1.25rem auto 2.5rem;
      border: 2px solid var(--ink);
      background: var(--surface);
    }

    .workspace.active {
      display: grid;
      grid-template-columns: 310px 1fr;
      min-height: calc(100vh - 3.75rem);
    }

    .workspace.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Left Plum Navigation Rail (Where your name lands) */
    .plum-rail {
      background: var(--plum);
      color: #FFFFFF;
      border-right: 2px solid var(--ink);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .rail-identity {
      padding: 2rem 1.75rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.22);
    }

    .rail-tag {
      font-size: 0.72rem;
      opacity: 0.8;
      letter-spacing: 0.08em;
      display: block;
      margin-bottom: 0.5rem;
    }

    .rail-identity h1 {
      font-size: 1.55rem;
      font-weight: 700;
      line-height: 1.2;
      text-transform: uppercase;
      letter-spacing: -0.01em;
    }

    /* Flat Stacked Category Buttons */
    .rail-nav {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .nav-item {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.18);
      color: rgba(255, 255, 255, 0.85);
      font-family: var(--mono);
      font-size: 0.95rem;
      text-align: left;
      padding: 1.25rem 1.75rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background-color 0.15s ease, color 0.15s ease, padding-left 0.15s ease;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #FFFFFF;
      padding-left: 2.1rem;
    }

    .nav-item.active {
      background: var(--surface);
      color: var(--plum);
      font-weight: 700;
      padding-left: 2.1rem;
    }

    .nav-code {
      font-size: 0.75rem;
      opacity: 0.7;
    }

    .rail-footer {
      padding: 1.25rem 1.75rem;
      border-top: 1px solid rgba(255, 255, 255, 0.22);
    }

    .reset-spring-btn {
      width: 100%;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.45);
      color: #FFFFFF;
      font-family: var(--mono);
      font-size: 0.78rem;
      padding: 0.6rem 0.9rem;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .reset-spring-btn:hover {
      background: #FFFFFF;
      color: var(--plum);
    }

    /* Right Content Canvas */
    .content-pane {
      padding: 2.75rem 3.25rem;
      background: var(--surface);
    }

    .tab-panel {
      display: none;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .tab-panel.active {
      display: block;
    }

    .tab-panel.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Flat Section Header */
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 1rem;
      padding-bottom: 1.15rem;
      margin-bottom: 2.25rem;
      border-bottom: 2px solid var(--ink);
    }

    .panel-header h2 {
      font-size: 2.1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      color: var(--plum);
    }

    .panel-index {
      font-size: 0.82rem;
      color: var(--ink-muted);
    }

    h3 {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 0.35rem;
    }

    p {
      font-size: 0.96rem;
      color: var(--ink-muted);
      margin-bottom: 1.15rem;
      max-width: 72ch;
    }

    /* Flat Photo Frames (Used ONLY in About Me, Projects, Skills) */
    .flat-photo {
      border: 1.5px solid var(--ink);
      background: var(--plum-tint);
      display: block;
      overflow: hidden;
    }

    .flat-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* MODULE 3: ABOUT ME */
    .about-layout {
      display: grid;
      grid-template-columns: 270px 1fr;
      gap: 2.75rem;
      align-items: start;
    }

    .about-photo {
      aspect-ratio: 4 / 5;
      width: 100%;
    }

    .flat-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem;
      margin-top: 1.75rem;
    }

    .flat-link {
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--plum);
      border: 1.5px solid var(--plum);
      padding: 0.55rem 1.1rem;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .flat-link:hover {
      background: var(--plum);
      color: #FFFFFF;
    }

    /* MODULE 4: PROJECTS */
    .project-block {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 2.25rem;
      padding-bottom: 2.5rem;
      margin-bottom: 2.5rem;
      border-bottom: 1px solid var(--border);
      align-items: start;
    }

    .project-block:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .project-photo {
      width: 100%;
      height: 260px;
    }

    .meta-line {
      display: inline-block;
      background: var(--plum-tint);
      color: var(--plum);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 0.2rem 0.6rem;
      margin-bottom: 0.9rem;
    }

    /* MODULE 5: EXPERIENCES (NO PHOTOS — CLEAN TYPOGRAPHIC GRID) */
    .exp-item {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 2rem;
      padding: 1.75rem 0;
      border-bottom: 1px solid var(--border);
    }

    .exp-item:first-of-type {
      padding-top: 0;
    }

    .exp-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .exp-date {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--plum);
    }

    /* MODULE 6: SKILLS (WITH A FEW PHOTOS) */
    .skills-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2.5rem;
      margin-bottom: 2.5rem;
    }

    .skill-box {
      border: 1.5px solid var(--ink);
      padding: 1.5rem;
    }

    .skill-box h4 {
      font-size: 0.85rem;
      color: #FFFFFF;
      background: var(--plum);
      padding: 0.35rem 0.75rem;
      display: inline-block;
      margin-bottom: 1.1rem;
      text-transform: uppercase;
    }

    .skill-rows {
      list-style: none;
    }

    .skill-rows li {
      padding: 0.5rem 0;
      border-bottom: 1px dashed var(--border);
      font-size: 0.92rem;
      display: flex;
      justify-content: space-between;
    }

    .skill-rows li:last-child {
      border-bottom: none;
    }

    .skill-rows li span {
      color: var(--ink-muted);
      font-size: 0.8rem;
    }

    .skills-photos {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.25rem;
    }

    .skill-thumb {
      height: 175px;
    }

    /* MODULE 7: SUBJECTS / COURSEWORK (NO PHOTOS — FLAT SPEC TABLE) */
    .course-table {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      border-top: 1.5px solid var(--ink);
      border-left: 1.5px solid var(--ink);
    }

    .course-cell {
      border-right: 1.5px solid var(--ink);
      border-bottom: 1.5px solid var(--ink);
      padding: 1.65rem;
      transition: background-color 0.15s ease;
    }

    .course-cell:hover {
      background: var(--plum-tint);
    }

    .course-tag {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--plum);
      margin-bottom: 0.4rem;
      display: block;
    }

    .course-cell h3 {
      font-size: 1.15rem;
      margin-bottom: 0.5rem;
    }

    .course-cell p {
      font-size: 0.88rem;
      margin-bottom: 0;
    }

    @media (max-width: 860px) {
      .workspace.active {
        grid-template-columns: 1fr;
        width: 98%;
      }
      .plum-rail {
        border-right: none;
