<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Name — Portfolio</title>
  <!-- Editorial Serif + Humanist Sans + Monospace -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --plum: rgb(116, 13, 130);          /* #740D82 */
      --plum-deep: rgb(82, 9, 92);
      --plum-tint: rgba(116, 13, 130, 0.06);
      --plum-line: rgba(116, 13, 130, 0.25);
      --paper: #FBF9F7;
      --paper-card: #FFFFFF;
      --ink: #1D1A20;
      --ink-soft: #57515E;
      --rule: #E6E0E8;
      --serif: "Newsreader", Georgia, serif;
      --sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: "JetBrains Mono", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--sans);
      background-color: var(--paper);
      color: var(--ink);
      line-height: 1.7;
      min-height: 100vh;
      padding: 3.5rem 1.5rem 5rem;
      display: flex;
      justify-content: center;
      /* Subtle tactile paper-dot texture */
      background-image: radial-gradient(rgba(116, 13, 130, 0.08) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    .sheet {
      width: 100%;
      max-width: 780px;
      background: var(--paper);
    }

    /* Editorial Left-Aligned Header */
    header {
      border-bottom: 1.5px solid var(--ink);
      padding-bottom: 1.75rem;
      margin-bottom: 1.75rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .eyebrow {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--plum);
      letter-spacing: 0.03em;
      margin-bottom: 0.4rem;
      display: block;
    }

    h1 {
      font-family: var(--serif);
      font-size: 2.85rem;
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    .subtitle {
      font-family: var(--serif);
      font-style: italic;
      font-size: 1.2rem;
      color: var(--ink-soft);
      margin-top: 0.35rem;
    }

    .header-note {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--ink-soft);
      border: 1px solid var(--rule);
      background: var(--paper-card);
      padding: 0.35rem 0.75rem;
      border-radius: 4px;
    }

    .header-note::before {
      content: "● ";
      color: var(--plum);
    }

    /* Underlined Bookmark-Style Navigation */
    .tab-nav {
      display: flex;
      gap: 1.75rem;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--rule);
      margin-bottom: 2.5rem;
    }

    .tab-btn {
      background: none;
      border: none;
      font-family: var(--sans);
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--ink-soft);
      padding: 0.65rem 0.1rem;
      cursor: pointer;
      position: relative;
      transition: color 0.2s ease;
    }

    .tab-btn:hover {
      color: var(--plum);
    }

    .tab-btn.active {
      color: var(--plum);
      font-weight: 600;
    }

    .tab-btn.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 2.5px;
      background: var(--plum);
    }

    /* Smooth Tab Transitions */
    .tab-panel {
      display: none;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .tab-panel.active {
      display: block;
    }

    .tab-panel.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Section Headings */
    h2 {
      font-family: var(--serif);
      font-size: 1.75rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
      color: var(--ink);
    }

    h3 {
      font-family: var(--serif);
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.3;
    }

    p {
      color: var(--ink-soft);
      margin-bottom: 1rem;
      font-size: 1rem;
    }

    /* Tactile Photo Frames (Offset Polaroid / Print Aesthetic) */
    .photo-box {
      position: relative;
      background: var(--paper-card);
      border: 1px solid var(--rule);
      padding: 6px;
      border-radius: 4px;
      box-shadow: 4px 4px 0px var(--plum-tint);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .photo-box:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px var(--plum-line);
    }

    .photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 2px;
      background: var(--plum-tint);
    }

    .photo-caption {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--ink-soft);
      padding: 0.45rem 0.25rem 0.1rem;
      display: block;
    }

    /* 1. About Me Layout */
    .about-grid {
      display: grid;
      grid-template-columns: 210px 1fr;
      gap: 2.25rem;
      align-items: start;
    }

    .portrait-box {
      aspect-ratio: 4 / 5;
      transform: rotate(-1.5deg);
    }

    .portrait-box:hover {
      transform: rotate(0deg) translate(-2px, -2px);
    }

    .text-links {
      display: flex;
      gap: 1.25rem;
      flex-wrap: wrap;
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px dashed var(--rule);
    }

    .text-links a {
      font-family: var(--mono);
      font-size: 0.85rem;
      color: var(--plum);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s ease;
    }

    .text-links a:hover {
      border-bottom-color: var(--plum);
    }

    /* 2. Projects (Editorial Articles) */
    .entry {
      padding-bottom: 2.25rem;
      margin-bottom: 2.25rem;
      border-bottom: 1px solid var(--rule);
    }

    .entry:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .entry-photo {
      width: 100%;
      height: 250px;
      margin-bottom: 1.1rem;
    }

    .entry-meta {
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--plum);
      margin: 0.3rem 0 0.75rem;
    }

    .entry-links {
      display: flex;
      gap: 1rem;
      margin-top: 0.75rem;
    }

    .entry-links a {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1.5px solid var(--plum);
      padding-bottom: 1px;
    }

    .entry-links a:hover {
      color: var(--plum);
    }

    /* 3. Experiences (Timeline / Margin Layout) */
    .exp-row {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 1.5rem;
      padding-bottom: 2rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--rule);
    }

    .exp-row:last-child {
      border-bottom: none;
    }

    .exp-thumb {
      width: 150px;
      height: 115px;
    }

    /* 4. Skills (Clean Index List + Snapshots) */
    .skills-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      margin-bottom: 2rem;
    }

    .skill-group h4 {
      font-family: var(--mono);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--plum);
      margin-bottom: 0.75rem;
    }

    .skill-list {
      list-style: none;
    }

    .skill-list li {
      padding: 0.4rem 0;
      border-bottom: 1px dashed var(--rule);
      font-size: 0.96rem;
      color: var(--ink);
      display: flex;
      justify-content: space-between;
    }

    .skill-list li span {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--ink-soft);
    }

    .snapshot-pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }

    .snapshot-box {
      height: 165px;
    }

    /* 5. Subjects (Coursework Notebook Grid) */
    .subject-grid {
      display: grid;
      grid-template-columns
