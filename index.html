<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Full Name — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --plum: rgb(116, 13, 130);          /* #740D82 */
      --plum-deep: rgb(78, 8, 88);
      --plum-mid: rgba(116, 13, 130, 0.45);
      --plum-wash: rgba(116, 13, 130, 0.11);
      --plum-mist: rgba(168, 85, 180, 0.08);
      --paper: #FBF9F7;
      --paper-card: rgba(255, 255, 255, 0.88);
      --ink: #1C1820;
      --ink-soft: #564F5E;
      --rule: #E4DCE7;
      --serif: "Newsreader", Georgia, serif;
      --sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: "JetBrains Mono", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--sans);
      background-color: var(--paper);
      color: var(--ink);
      line-height: 1.75;
      min-height: 100vh;
      padding: 2.5rem 1.5rem 5rem;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* ================= WATERCOLOR AMBIENT WASHES ================= */
    .watercolor-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .wash {
      position: absolute;
      border-radius: 50%;
      filter: blur(65px);
      opacity: 0.75;
    }

    .wash-1 {
      width: 520px;
      height: 420px;
      top: -90px;
      left: 8%;
      background: radial-gradient(circle, rgba(116, 13, 130, 0.16) 0%, rgba(186, 104, 200, 0.06) 55%, transparent 75%);
      border-radius: 62% 38% 46% 54% / 60% 44% 56% 40%;
    }

    .wash-2 {
      width: 600px;
      height: 500px;
      top: 28%;
      right: -80px;
      background: radial-gradient(circle, rgba(116, 13, 130, 0.13) 0%, rgba(142, 36, 170, 0.05) 60%, transparent 78%);
      border-radius: 40% 60% 65% 35% / 45% 55% 45% 55%;
    }

    .wash-3 {
      width: 480px;
      height: 380px;
      bottom: -60px;
      left: 18%;
      background: radial-gradient(circle, rgba(116, 13, 130, 0.12) 0%, transparent 72%);
      border-radius: 55% 45% 38% 62% / 52% 60% 40% 48%;
    }

    .canvas {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 980px;
    }

    /* ================= STAGE 1: COVER SCREEN ================= */
    .cover-screen {
      min-height: 78vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem 1rem;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .cover-screen.hiding {
      opacity: 0;
      transform: translateY(-16px);
    }

    .cover-screen.hidden {
      display: none;
    }

    .origin-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--plum);
      box-shadow: 0 0 0 8px var(--plum-wash), 0 0 0 18px var(--plum-mist);
      margin-bottom: 1.75rem;
    }

    .eyebrow {
      font-family: var(--mono);
      font-size: 0.82rem;
      color: var(--plum);
      letter-spacing: 0.06em;
      margin-bottom: 0.75rem;
      display: block;
    }

    .cover-title {
      font-family: var(--serif);
      font-size: clamp(3.1rem, 7vw, 4.8rem);
      font-weight: 600;
      line-height: 1.05;
      letter-spacing: -0.025em;
      color: var(--ink);
      margin-bottom: 1.1rem;
    }

    .cover-subtitle {
      font-family: var(--serif);
      font-style: italic;
      font-size: 1.45rem;
      color: var(--ink-soft);
      max-width: 620px;
      margin-bottom: 2.5rem;
    }

    .enter-btn {
      font-family: var(--mono);
      font-size: 0.95rem;
      font-weight: 500;
      color: #FFFFFF;
      background: var(--plum);
      border: none;
      padding: 1rem 2rem;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(116, 13, 130, 0.25);
      transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
    }

    .enter-btn:hover {
      background: var(--plum-deep);
      transform: translateY(-3px);
      box-shadow: 0 14px 34px rgba(116, 13, 130, 0.34);
    }

    /* ================= STAGE 2: FLUID 5-NODE MAP ================= */
    .flow-hub {
      display: none;
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    .flow-hub.active {
      display: block;
    }

    .flow-hub.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Top Origin Header */
    .hub-origin {
      text-align: center;
      position: relative;
      padding-top: 0.5rem;
    }

    .hub-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .ghost-btn {
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--ink-soft);
      background: var(--paper-card);
      border: 1px solid var(--rule);
      padding: 0.45rem 0.95rem;
      border-radius: 999px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: all 0.2s ease;
    }

    .ghost-btn:hover {
      color: var(--plum);
      border-color: var(--plum);
    }

    .origin-badge {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      background: var(--paper-card);
      border: 1.5px solid var(--plum-mid);
      padding: 1.25rem 2.5rem;
      border-radius: 60px 60px 48px 48px;
      box-shadow: 0 12px 36px rgba(116, 13, 130, 0.08);
      backdrop-filter: blur(8px);
    }

    .origin-badge h1 {
      font-family: var(--serif);
      font-size: 2.35rem;
      font-weight: 600;
      line-height: 1.1;
    }

    .origin-badge span {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--plum);
      margin-top: 0.3rem;
    }

    /* Diverging Watercolor SVG Branches */
    .flow-streams {
      width: 100%;
      height: 120px;
      display: block;
      overflow: visible;
    }

    .stream-path {
      fill: none;
      stroke: url(#plumWatercolorGrad);
      stroke-width: 2.5;
      stroke-linecap: round;
      opacity: 0.75;
      transition: stroke-width 0.3s ease, opacity 0.3s ease;
    }

    .stream-wash {
      fill: none;
      stroke: rgba(116, 13, 130, 0.09);
      stroke-width: 14;
      stroke-linecap: round;
      filter: blur(4px);
    }

    /* 5 Large Diverging Nodes */
    .nodes-constellation {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 1.5rem;
      margin-top: -6px;
    }

    /* Top row: 3 large nodes (each spans 2 cols); Bottom row: 2 wide centered nodes (each spans 3 cols) */
    .node-card:nth-child(1),
    .node-card:nth-child(2),
    .node-card:nth-child(3) {
      grid-column: span 2;
    }

    .node-card:nth-child(4),
    .node-card:nth-child(5) {
      grid-column: span 3;
    }

    .node-card {
      position: relative;
      background: var(--paper-card);
      backdrop-filter: blur(10px);
      border: 1.5px solid var(--rule);
      padding: 2.15rem 1.85rem;
      text-align: left;
      cursor: pointer;
      /* Organic, slightly varied pebble/watercolor node corners */
      border-radius: 28px 18px 30px 20px;
      box-shadow: 0 10px 30px rgba(116, 13, 130, 0.05);
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 0.3s ease,
                  box-shadow 0.3s ease,
                  background 0.3s ease;
      overflow: hidden;
    }

    .node-card:nth-child(even) {
      border-radius: 18px 30px 20px 28px;
    }

    /* Watercolor blotch inside each node on hover */
    .node-card::before {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;

      bottom: -55px;
